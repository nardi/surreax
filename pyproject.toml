[project]
name = "surreax"
version = "0.0.1"
description = "Surrogate model training library for JAX"
readme = "README.md"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.9.0",
    "equinox>=0.11.7",
    "jaxtyping>=0.2.34",
    "beartype>=0.19.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "optimistix>=0.0.9",
    "optax>=0.2.3",
    "lineax>=0.0.7",
    "asdex>=0.5.1",
    "splineax>=0.4.0",
]

[project.urls]
Repository = "https://github.com/nardi/surreax"
Documentation = "https://nardi.github.io/surreax"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "markdown-pytest>=0.4",
    "zensical>=0.0.61",
    "pyinstrument>=4.6",
]

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# jaxtyping shape strings like `Float[Array, "n d"]` are not Python expressions,
# so ruff misreads them as broken forward annotations.
ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs", "README.md"]
addopts = "--strict-markers"
markers = [
    "unit: one module on small inputs",
    "slow: a test that takes about ten seconds or more",
    "integration: several modules together, or a whole fit on a test system",
    "benchmark: timings of the hot paths",
]

[tool.coverage.run]
branch = true
source = ["surreax"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "^\\s*\\.\\.\\.\\s*$",
    "if TYPE_CHECKING:",
    "^\\s*case _:$",
]

[tool.ty.environment]
python-version = "3.11"
