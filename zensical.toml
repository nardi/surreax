[project]
site_url = "https://nardi.github.io/surreax/"
site_name = "surreax"
site_description = "Surrogate model training for JAX functions"
site_author = "Nardi Lam"
repo_url = "https://github.com/nardi/surreax"
repo_name = "nardi/surreax"

nav = [
  { "Introduction" = "index.md" },
  { "Basic workflow" = "getting-started.md" },
  { "Model forms" = "forms.md" },
  { "Fitting techniques" = "techniques.md" },
  { "Implicit targets" = "implicit.md" },
  { "Terminology" = "terminology.md" },
  { "Test systems" = "test-systems.md" },
  { "Development" = "development.md" },
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
extra_css = ["stylesheets/schematic.css"]

# The dropdown of the page title that switches to the other documentation sites,
# which the theme lists by default.
[project.extra.site_switcher]
current = "surreax"

[project.theme]
language = "en"
# The Tufte theme comes from the `theme` submodule and extends the built-in theme. It
# loads its own fonts, so the built-in theme loads none from Google Fonts.
custom_dir = "theme/zensical_tufte"
font = false
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# The directory of the theme contains two files of its Python packaging, which the site
# does not need.
[project.plugins.exclude]
glob = ["mkdocs_theme.yml", "__init__.py", "__pycache__/*"]

